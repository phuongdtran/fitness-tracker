<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Tracker</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e0e;--surface:#161616;--surface2:#1e1e1e;--border:#2a2a2a;--accent:#c8f04a;--accent2:#4af0c8;--text:#f0f0f0;--text2:#888;--text3:#555;--danger:#f04a4a;--warning:#f0a84a;--mono:'DM Mono',monospace;--sans:'Syne',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;font-size:13px}
.header{border-bottom:1px solid var(--border);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:100}
.header h1{font-family:var(--sans);font-weight:800;font-size:18px;letter-spacing:-.5px;color:var(--accent)}
.header-actions{display:flex;gap:8px;align-items:center}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 24px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:14px 16px;font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none}
.tab:hover{color:var(--text2)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.main{padding:24px;max-width:900px;margin:0 auto}
.section{display:none}.section.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden}
.card-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.card-header:hover{background:var(--surface2)}
.card-title{font-family:var(--sans);font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
.card-body{padding:0 16px 16px;display:none}.card-body.open{display:block}
.chevron{color:var(--text3);transition:transform .2s;font-size:10px}.chevron.open{transform:rotate(180deg)}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-family:var(--sans);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.tag-legs{background:#1a2e0a;color:#8fda4f}.tag-arms{background:#0a1a2e;color:#4fb8da}
.tag-shoulders{background:#2e1a0a;color:#daa04f}.tag-back{background:#1a0a2e;color:#a04fda}
.tag-chest{background:#2e0a1a;color:#da4f8a}.tag-abs{background:#2e2a0a;color:#dad04f}
.tag-compound{background:#0a2e2a;color:#4fdad0}
.ex-table{width:100%;border-collapse:collapse;margin-top:12px}
.ex-table th{text-align:left;padding:8px 10px;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border)}
.ex-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5}
.ex-table tr:last-child td{border-bottom:none}.ex-table tr:hover td{background:var(--surface2)}
.secondary-muscle{color:var(--text2);font-size:11px;margin-top:2px}
.btn{padding:8px 14px;border-radius:5px;font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.3px;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-accent{background:var(--accent);color:#0e0e0e}.btn-accent:hover{background:#d4f55a}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--text2);color:var(--text)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}.btn-danger:hover{background:var(--danger);color:white}
.btn-sm{padding:5px 10px;font-size:10px}
.actions-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:6px}.form-group.full{grid-column:1/-1}
.form-label{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text2)}
.form-input,.form-select,.form-textarea{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:9px 12px;color:var(--text);font-family:var(--mono);font-size:13px;width:100%;transition:border-color .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--accent)}
.form-select option{background:var(--surface2)}.form-textarea{resize:vertical;min-height:60px}
.routine-meta{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 12px;color:var(--text2);font-size:12px}
.routine-meta span{display:flex;align-items:center;gap:4px}
.routine-exercise-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.routine-exercise-row:last-child{border-bottom:none}
.move-num{font-family:var(--sans);font-weight:800;font-size:20px;color:var(--accent);min-width:28px;line-height:1;margin-top:2px}
.ex-info{flex:1}.ex-name{font-family:var(--sans);font-weight:600;font-size:13px}
.ex-details{color:var(--text2);font-size:11px;margin-top:3px}
.builder-exercise{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:8px}
.builder-move-num{font-family:var(--sans);font-weight:800;font-size:18px;color:var(--accent);min-width:24px}
.builder-ex-info{flex:1}.builder-ex-name{font-family:var(--sans);font-weight:600;font-size:13px}
.builder-ex-sub{color:var(--text2);font-size:11px;margin-top:2px}
.builder-controls{display:flex;gap:4px;align-items:center}
.icon-btn{width:28px;height:28px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s}
.icon-btn:hover{border-color:var(--text2);color:var(--text)}.icon-btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.time-badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-family:var(--sans);font-weight:700;font-size:13px;color:var(--accent2);display:inline-flex;align-items:center;gap:6px}
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:var(--sans);font-weight:600;font-size:11px;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.3px}
.filter-chip:hover{border-color:var(--text2);color:var(--text)}.filter-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(200,240,74,.08)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-family:var(--sans);font-weight:700;font-size:16px;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:32px;margin-bottom:12px}.empty p{font-family:var(--sans);font-size:13px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-title{font-family:var(--sans);font-weight:800;font-size:22px;letter-spacing:-.5px}
.builder-summary{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:20px;display:flex;gap:20px;flex-wrap:wrap}
.summary-stat{display:flex;flex-direction:column;gap:3px}
.summary-stat-val{font-family:var(--sans);font-weight:700;font-size:20px;color:var(--accent)}
.summary-stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.picker-list{max-height:300px;overflow-y:auto}
.picker-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;cursor:pointer;transition:background .1s}
.picker-item:hover{background:var(--surface2)}
.picker-item-name{font-family:var(--sans);font-weight:600;font-size:13px}
.picker-item-sub{font-size:11px;color:var(--text2);margin-top:2px}
.search-input-wrap{position:relative;margin-bottom:12px}
.search-input-wrap input{padding-left:32px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);display:inline-block;transition:background .3s}
.sync-dot.synced{background:var(--accent)}.sync-dot.syncing{background:var(--warning);animation:pulse 1s infinite}.sync-dot.error{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sync-label{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px}
.inline-num{width:52px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:4px 8px;color:var(--text);font-family:var(--mono);font-size:12px;text-align:center}
.signin-banner{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.signin-banner p{color:var(--text2);font-size:12px}
@media(max-width:500px){.main{padding:16px}.header{padding:14px 16px}.tabs{padding:0 16px}.tab{padding:12px;font-size:11px}}
</style>
</head>
<body>
<div class="header">
  <h1>⚡ FIT TRACKER</h1>
  <div class="header-actions">
    <div class="sync-label"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">not signed in</span></div>
    <button class="btn btn-ghost btn-sm" id="authBtn" onclick="handleAuthClick()">Sign in</button>
    <button class="btn btn-ghost btn-sm" onclick="exportData()">↓ Export</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()">↑ Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</div>
<div class="tabs">
  <button class="tab active" onclick="switchTab('library')">Exercise Library</button>
  <button class="tab" onclick="switchTab('routines')">Routines</button>
  <button class="tab" onclick="switchTab('builder')">Builder</button>
</div>
<div class="main">
  <div id="signInBanner" class="signin-banner" style="display:none">
    <p>Sign in with Google to sync across all devices automatically.</p>
    <button class="btn btn-accent btn-sm" onclick="handleAuthClick()">Sign in with Google</button>
  </div>
  <div id="tab-library" class="section active">
    <div class="section-header"><span class="section-title">Exercise Library</span><button class="btn btn-accent" onclick="openAddExercise()">+ Add Exercise</button></div>
    <div class="filter-row" id="libraryFilters"></div>
    <div id="libraryList"></div>
  </div>
  <div id="tab-routines" class="section">
    <div class="section-header"><span class="section-title">Routines</span><button class="btn btn-accent" onclick="switchTab('builder')">+ New Routine</button></div>
    <div id="routinesList"></div>
  </div>
  <div id="tab-builder" class="section">
    <div class="section-header"><span class="section-title">Routine Builder</span></div>
    <div class="card" style="margin-bottom:20px"><div style="padding:16px">
      <div class="form-grid" style="margin-top:0">
        <div class="form-group"><label class="form-label">Routine Name</label><input class="form-input" id="builderName" placeholder="e.g. Legacy Complex"></div>
        <div class="form-group"><label class="form-label">Sets</label><input class="form-input" type="number" id="builderSets" value="3" min="1" max="10"></div>
        <div class="form-group"><label class="form-label">Notes</label><input class="form-input" id="builderNotes" placeholder="Optional notes"></div>
        <div class="form-group"><label class="form-label">Vest</label>
          <select class="form-select" id="builderVest"><option value="">No vest</option><option value="20 lb vest">20 lb vest</option></select>
        </div>
      </div>
    </div></div>
    <div class="builder-summary">
      <div class="summary-stat"><span class="summary-stat-val" id="sumExercises">0</span><span class="summary-stat-label">Exercises</span></div>
      <div class="summary-stat"><span class="summary-stat-val" id="sumSets">0</span><span class="summary-stat-label">Total Sets</span></div>
      <div class="summary-stat"><span class="summary-stat-val" id="sumTime">0m</span><span class="summary-stat-label">Est. Time</span></div>
      <div class="summary-stat"><span class="summary-stat-val" id="sumMuscles" style="font-size:12px;line-height:1.4">—</span><span class="summary-stat-label">Muscles</span></div>
    </div>
    <div id="builderExercises"></div>
    <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="openExercisePicker()">+ Add Exercise</button>
      <button class="btn btn-accent" onclick="saveRoutinePrompt()">Save Routine</button>
      <button class="btn btn-ghost" onclick="clearBuilder()">Clear</button>
    </div>
  </div>
</div>

<!-- ADD EXERCISE -->
<div class="modal-overlay" id="modalAddEx"><div class="modal">
  <h3>Add Exercise</h3>
  <div class="form-grid" style="margin-top:0">
    <div class="form-group full"><label class="form-label">Name</label><input class="form-input" id="exName" placeholder="e.g. Single leg RDL"></div>
    <div class="form-group"><label class="form-label">Primary Muscle</label>
      <select class="form-select" id="exPrimary"><option value="">Select...</option><option>Hamstrings</option><option>Glutes</option><option>Quads</option><option>Inner thigh</option><option>Calves</option><option>Biceps</option><option>Triceps</option><option>Shoulders</option><option>Chest</option><option>Back</option><option>Core</option><option>Abs</option><option>Compound</option></select>
    </div>
    <div class="form-group"><label class="form-label">Secondary</label><input class="form-input" id="exSecondary" placeholder="e.g. Core, Balance"></div>
    <div class="form-group"><label class="form-label">Weight</label><input class="form-input" id="exWeight" placeholder="e.g. 2x20 lbs"></div>
    <div class="form-group"><label class="form-label">Category</label>
      <select class="form-select" id="exCategory"><option value="">Auto</option><option>Legs</option><option>Arms</option><option>Shoulders</option><option>Back</option><option>Chest</option><option>Abs</option><option>Compound</option></select>
    </div>
    <div class="form-group full"><label class="form-label">Notes</label><textarea class="form-textarea" id="exNotes" placeholder="e.g. Pulsing, single leg"></textarea></div>
  </div>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal('modalAddEx')">Cancel</button><button class="btn btn-accent" onclick="saveExercise()">Save</button></div>
</div></div>

<!-- EDIT EXERCISE -->
<div class="modal-overlay" id="modalEditEx"><div class="modal">
  <h3>Edit Exercise</h3><input type="hidden" id="editExId">
  <div class="form-grid" style="margin-top:0">
    <div class="form-group full"><label class="form-label">Name</label><input class="form-input" id="editExName"></div>
    <div class="form-group"><label class="form-label">Primary Muscle</label>
      <select class="form-select" id="editExPrimary"><option value="">Select...</option><option>Hamstrings</option><option>Glutes</option><option>Quads</option><option>Inner thigh</option><option>Calves</option><option>Biceps</option><option>Triceps</option><option>Shoulders</option><option>Chest</option><option>Back</option><option>Core</option><option>Abs</option><option>Compound</option></select>
    </div>
    <div class="form-group"><label class="form-label">Secondary</label><input class="form-input" id="editExSecondary"></div>
    <div class="form-group"><label class="form-label">Weight</label><input class="form-input" id="editExWeight"></div>
    <div class="form-group"><label class="form-label">Category</label>
      <select class="form-select" id="editExCategory"><option value="">Auto</option><option>Legs</option><option>Arms</option><option>Shoulders</option><option>Back</option><option>Chest</option><option>Abs</option><option>Compound</option></select>
    </div>
    <div class="form-group full"><label class="form-label">Notes</label><textarea class="form-textarea" id="editExNotes"></textarea></div>
  </div>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal('modalEditEx')">Cancel</button><button class="btn btn-accent" onclick="updateExercise()">Save Changes</button></div>
</div></div>

<!-- PICKER -->
<div class="modal-overlay" id="modalPicker"><div class="modal">
  <h3>Add Exercise to Routine</h3>
  <div class="filter-row" id="pickerFilters" style="margin-bottom:10px"></div>
  <div class="search-input-wrap"><span class="search-icon">⌕</span><input class="form-input" id="pickerSearch" placeholder="Search..." oninput="renderPicker()"></div>
  <div class="picker-list" id="pickerList"></div>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal('modalPicker')">Done</button></div>
</div></div>

<!-- CONFIRM -->
<div class="modal-overlay" id="modalConfirm"><div class="modal">
  <h3 id="confirmTitle">Are you sure?</h3>
  <p id="confirmMsg" style="color:var(--text2);font-size:13px;margin-bottom:4px"></p>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal('modalConfirm')">Cancel</button><button class="btn btn-danger" id="confirmBtn">Confirm</button></div>
</div></div>

<!-- SAVE ROUTINE -->
<div class="modal-overlay" id="modalSaveRoutine"><div class="modal">
  <h3>Save Routine?</h3>
  <p id="saveRoutineMsg" style="color:var(--text2);font-size:13px;margin-bottom:4px"></p>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal('modalSaveRoutine')">Cancel</button><button class="btn btn-accent" onclick="confirmSaveRoutine()">Save</button></div>
</div></div>

<!-- EDIT ROUTINE -->
<div class="modal-overlay" id="modalEditRoutine"><div class="modal">
  <h3>Edit Routine</h3><input type="hidden" id="editRoutineId">
  <div class="form-grid" style="margin-top:0">
    <div class="form-group full"><label class="form-label">Name</label><input class="form-input" id="editRoutineName"></div>
    <div class="form-group"><label class="form-label">Sets</label><input class="form-input" type="number" id="editRoutineSets" min="1" max="10"></div>
    <div class="form-group"><label class="form-label">Vest</label>
      <select class="form-select" id="editRoutineVest"><option value="">No vest</option><option value="20 lb vest">20 lb vest</option></select>
    </div>
    <div class="form-group full"><label class="form-label">Notes</label><input class="form-input" id="editRoutineNotes"></div>
  </div>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal('modalEditRoutine')">Cancel</button><button class="btn btn-accent" onclick="updateRoutine()">Save Changes</button></div>
</div></div>

<script>
const CLIENT_ID='46096792648-uep414vh6ttj77cfndi17pmo9ia2s45c.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE='fittracker_data.json';
const LOCAL_KEY='fittracker_v1';
let db={exercises:[],routines:[]},accessToken=null,driveFileId=null,syncTimer=null;

const seedEx=[

// AUTH
function handleAuthClick(){
  const c=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:async r=>{
    if(r.error){setSS('error','auth error');return;}
    accessToken=r.access_token;localStorage.setItem('ft_token',accessToken);
    document.getElementById('authBtn').textContent='Signed in ✓';
    document.getElementById('signInBanner').style.display='none';
    setSS('syncing','syncing...');await syncDrive();
  }});c.requestAccessToken();
}
function setSS(s,l){document.getElementById('syncDot').className='sync-dot '+s;document.getElementById('syncLabel').textContent=l;}

// DRIVE
async function driveReq(method,url,body){
  const o={method,headers:{Authorization:'Bearer '+accessToken}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
  const r=await fetch(url,o);
  if(r.status===401){accessToken=null;setSS('error','token expired');return null;}
  if(!r.ok)return null;
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json')?r.json():r.text();
}
async function findFile(){
  const l=await driveReq('GET',`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${DRIVE_FILE}'&fields=files(id,name)`);
  if(!l)return null;
  if(l.files&&l.files.length>0){driveFileId=l.files[0].id;return driveFileId;}
  const m=await driveReq('POST','https://www.googleapis.com/drive/v3/files?fields=id',{name:DRIVE_FILE,parents:['appDataFolder']});
  if(!m)return null;driveFileId=m.id;return driveFileId;
}
async function readDrive(){
  if(!driveFileId)return null;
  const r=await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,{headers:{Authorization:'Bearer '+accessToken}});
  if(!r.ok)return null;try{return await r.json();}catch{return null;}
}
async function writeDrive(){
  if(!driveFileId)return;
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,{
    method:'PATCH',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify(db)
  });
}
async function syncDrive(){
  if(!accessToken)return;setSS('syncing','syncing...');
  try{
    await findFile();if(!driveFileId){setSS('error','drive error');return;}
    const remote=await readDrive();
    if(remote&&remote.exercises&&remote.routines){
      const lt=parseInt(localStorage.getItem('ft_ts')||'0'),rt=remote._ts||0;
      if(rt>lt){db=remote;saveLocal();renderAll();}else{db._ts=Date.now();await writeDrive();}
    }else{db._ts=Date.now();await writeDrive();}
    setSS('synced','synced ✓');
  }catch{setSS('error','sync error');}
}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>{if(accessToken)syncDrive();},2000);}

// STORAGE
function saveLocal(){const ts=Date.now();localStorage.setItem('ft_ts',ts);localStorage.setItem(LOCAL_KEY,JSON.stringify(db));}
function saveData(){saveLocal();if(accessToken){setSS('syncing','saving...');scheduleSync();}else setSS('synced','saved locally');}
function loadData(){
  try{const r=localStorage.getItem(LOCAL_KEY);if(r)db=JSON.parse(r);
  else{db={exercises:JSON.parse(JSON.stringify(seedEx)),routines:JSON.parse(JSON.stringify(seedRt))};saveLocal();}
  }catch{db={exercises:JSON.parse(JSON.stringify(seedEx)),routines:JSON.parse(JSON.stringify(seedRt))};}
}
function exportData(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fittracker_backup.json';a.click();}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.exercises&&d.routines){db=d;saveData();renderAll();alert('Imported.');}else alert('Invalid file.');}catch{alert('Could not parse.');}};
  r.readAsText(f);e.target.value='';
}

// UTILS
function uid(){return 'id_'+Math.random().toString(36).substr(2,9);}
function getEx(id){return db.exercises.find(e=>e.id===id);}
function catTag(c){const m={Legs:'tag-legs',Arms:'tag-arms',Shoulders:'tag-shoulders',Back:'tag-back',Chest:'tag-chest',Abs:'tag-abs',Compound:'tag-compound'};return`<span class="tag ${m[c]||'tag-compound'}">${c}</span>`;}
function estTime(exs,sets){let s=0;exs.forEach(x=>{s+=x.reps*3+20;});s*=sets;s+=(sets-1)*60;return Math.round(s/60)+'m';}
function getMuscles(exs){const m=new Set();exs.forEach(x=>{const e=getEx(x.exerciseId);if(e)m.add(e.primary);});return[...m].join(', ');}
function autocat(p){if(['Hamstrings','Glutes','Quads','Inner thigh','Calves'].includes(p))return'Legs';if(['Biceps','Triceps'].includes(p))return'Arms';if(p==='Shoulders')return'Shoulders';if(['Core','Abs'].includes(p))return'Abs';if(p==='Back')return'Back';if(p==='Chest')return'Chest';return'Compound';}

// TABS
function switchTab(n){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['library','routines','builder'][i]===n));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+n).classList.add('active');
  if(n==='library')renderLibrary();if(n==='routines')renderRoutines();if(n==='builder')renderBuilder();
}

// LIBRARY
let libFilter='All';
function renderLibFilters(){
  const cats=['All',...new Set(db.exercises.map(e=>e.category).filter(Boolean).sort())];
  document.getElementById('libraryFilters').innerHTML=cats.map(c=>`<button class="filter-chip ${libFilter===c?'active':''}" onclick="setLibFilter('${c}')">${c}</button>`).join('');
}
function setLibFilter(c){libFilter=c;renderLibrary();}
function renderLibrary(){
  renderLibFilters();
  const filt=libFilter==='All'?db.exercises:db.exercises.filter(e=>e.category===libFilter);
  const grp={};filt.forEach(e=>{const g=e.category||'Other';if(!grp[g])grp[g]=[];grp[g].push(e);});
  const el=document.getElementById('libraryList');
  if(!filt.length){el.innerHTML='<div class="empty"><div class="empty-icon">📭</div><p>No exercises yet.</p></div>';return;}
  el.innerHTML=Object.entries(grp).map(([cat,exs])=>`
    <div class="card">
      <div class="card-header" onclick="toggleCard('lib-${cat}')">
        <div class="card-title">${catTag(cat)} ${cat} <span style="color:var(--text3);font-size:12px;font-weight:400">(${exs.length})</span></div>
        <span class="chevron" id="chev-lib-${cat}">▼</span>
      </div>
      <div class="card-body" id="lib-${cat}">
        <table class="ex-table"><thead><tr><th>Exercise</th><th>Primary</th><th>Secondary</th><th>Weight</th><th>Notes</th><th></th></tr></thead>
        <tbody>${exs.map(ex=>`<tr>
          <td><strong>${ex.name}</strong></td><td>${ex.primary||'—'}</td>
          <td><span class="secondary-muscle">${ex.secondary||'—'}</span></td>
          <td>${ex.weight||'—'}</td><td style="color:var(--text2)">${ex.notes||'—'}</td>
          <td><div style="display:flex;gap:4px"><button class="icon-btn" onclick="openEditEx('${ex.id}')">✎</button><button class="icon-btn danger" onclick="delExPrompt('${ex.id}')">✕</button></div></td>
        </tr>`).join('')}</tbody></table>
        <div style="margin-top:10px"><button class="btn btn-ghost btn-sm" onclick="openAddExercise('${cat}')">+ Add to ${cat}</button></div>
      </div>
    </div>`).join('');
}
function toggleCard(id){const b=document.getElementById(id),c=document.getElementById('chev-'+id);if(!b)return;b.classList.toggle('open');if(c)c.classList.toggle('open');}

// EXERCISE CRUD
function openAddExercise(precat){['exName','exSecondary','exWeight','exNotes'].forEach(i=>document.getElementById(i).value='');document.getElementById('exPrimary').value='';document.getElementById('exCategory').value=precat||'';openModal('modalAddEx');}
function saveExercise(){
  const name=document.getElementById('exName').value.trim();if(!name){alert('Name required.');return;}
  const p=document.getElementById('exPrimary').value,ci=document.getElementById('exCategory').value;
  db.exercises.push({id:uid(),name,primary:p,secondary:document.getElementById('exSecondary').value.trim(),weight:document.getElementById('exWeight').value.trim(),category:ci||autocat(p),notes:document.getElementById('exNotes').value.trim()});
  saveData();closeModal('modalAddEx');renderLibrary();
}
function openEditEx(id){
  const ex=getEx(id);if(!ex)return;
  document.getElementById('editExId').value=id;document.getElementById('editExName').value=ex.name;
  document.getElementById('editExPrimary').value=ex.primary||'';document.getElementById('editExSecondary').value=ex.secondary||'';
  document.getElementById('editExWeight').value=ex.weight||'';document.getElementById('editExCategory').value=ex.category||'';
  document.getElementById('editExNotes').value=ex.notes||'';openModal('modalEditEx');
}
function updateExercise(){
  const id=document.getElementById('editExId').value,ex=getEx(id);if(!ex)return;
  ex.name=document.getElementById('editExName').value.trim();ex.primary=document.getElementById('editExPrimary').value;
  ex.secondary=document.getElementById('editExSecondary').value.trim();ex.weight=document.getElementById('editExWeight').value.trim();
  const ci=document.getElementById('editExCategory').value;ex.category=ci||autocat(ex.primary);
  ex.notes=document.getElementById('editExNotes').value.trim();saveData();closeModal('modalEditEx');renderLibrary();
}
function delExPrompt(id){const ex=getEx(id);if(!ex)return;confirm2(`Delete "${ex.name}"?`,'Removes from library. Routines using it will show missing.',()=>{db.exercises=db.exercises.filter(e=>e.id!==id);saveData();renderLibrary();});}

// ROUTINES
function renderRoutines(){
  const el=document.getElementById('routinesList');
  if(!db.routines.length){el.innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>No routines yet.</p></div>';return;}
  el.innerHTML=db.routines.map(r=>`
    <div class="card">
      <div class="card-header" onclick="toggleCard('r-${r.id}')">
        <div class="card-title">${r.name} <span class="time-badge" style="font-size:11px;padding:3px 10px">${estTime(r.exercises,r.sets)}</span></div>
        <span class="chevron" id="chev-r-${r.id}">▼</span>
      </div>
      <div class="card-body" id="r-${r.id}">
        <div class="routine-meta"><span>🔁 ${r.sets} sets</span>${r.vest?`<span>🦺 ${r.vest}</span>`:''}<span>💪 ${getMuscles(r.exercises)||'—'}</span></div>
        ${r.notes?`<div style="color:var(--text2);font-size:12px;margin-bottom:12px">${r.notes}</div>`:''}
        ${r.exercises.map((ex,i)=>{const e=getEx(ex.exerciseId);return`<div class="routine-exercise-row"><div class="move-num">${i+1}</div><div class="ex-info"><div class="ex-name">${e?e.name:'<em style="color:var(--danger)">Exercise removed</em>'}</div><div class="ex-details">${ex.reps} reps · ${e?(e.weight||'BW'):''} ${ex.notes?'· '+ex.notes:''}</div></div></div>`;}).join('')}
        <div class="actions-row" style="margin-top:14px">
          <button class="btn btn-ghost btn-sm" onclick="loadToBuilder('${r.id}')">Edit in Builder</button>
          <button class="btn btn-ghost btn-sm" onclick="openEditRt('${r.id}')">Edit Details</button>
          <button class="btn btn-danger btn-sm" onclick="delRtPrompt('${r.id}')">Delete</button>
        </div>
      </div>
    </div>`).join('');
}
function openEditRt(id){
  const r=db.routines.find(x=>x.id===id);if(!r)return;
  document.getElementById('editRoutineId').value=id;document.getElementById('editRoutineName').value=r.name;
  document.getElementById('editRoutineSets').value=r.sets;document.getElementById('editRoutineVest').value=r.vest||'';
  document.getElementById('editRoutineNotes').value=r.notes||'';openModal('modalEditRoutine');
}
function updateRoutine(){
  const id=document.getElementById('editRoutineId').value,r=db.routines.find(x=>x.id===id);if(!r)return;
  r.name=document.getElementById('editRoutineName').value.trim();r.sets=parseInt(document.getElementById('editRoutineSets').value)||3;
  r.vest=document.getElementById('editRoutineVest').value;r.notes=document.getElementById('editRoutineNotes').value.trim();
  saveData();closeModal('modalEditRoutine');renderRoutines();
}
function delRtPrompt(id){const r=db.routines.find(x=>x.id===id);if(!r)return;confirm2(`Delete "${r.name}"?`,'Library exercises will not be affected.',()=>{db.routines=db.routines.filter(x=>x.id!==id);saveData();renderRoutines();});}
function loadToBuilder(id){
  const r=db.routines.find(x=>x.id===id);if(!r)return;
  bState.editingId=id;bState.exercises=r.exercises.map(ex=>({...ex}));
  document.getElementById('builderName').value=r.name;document.getElementById('builderSets').value=r.sets;
  document.getElementById('builderNotes').value=r.notes||'';document.getElementById('builderVest').value=r.vest||'';
  switchTab('builder');
}

// BUILDER
let bState={exercises:[],editingId:null},pickerFilter='All';
function renderBuilder(){
  const el=document.getElementById('builderExercises');
  if(!bState.exercises.length){el.innerHTML='<div class="empty" style="padding:24px 0"><div class="empty-icon">🏗</div><p>Click "+ Add Exercise" to start.</p></div>';}
  else el.innerHTML=bState.exercises.map((ex,i)=>{const e=getEx(ex.exerciseId);return`<div class="builder-exercise">
    <div class="builder-move-num">${i+1}</div>
    <div class="builder-ex-info"><div class="builder-ex-name">${e?e.name:'<em style="color:var(--danger)">Missing</em>'}</div>
    <div class="builder-ex-sub"><input class="inline-num" type="number" value="${ex.reps}" min="1" max="99" onchange="updReps(${i},this.value)"> reps · ${e?(e.weight||'BW'):''} · <input class="form-input" style="display:inline;width:130px;padding:4px 8px;font-size:11px" value="${ex.notes||''}" placeholder="notes" onchange="updNotes(${i},this.value)"></div></div>
    <div class="builder-controls"><button class="icon-btn" onclick="moveEx(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="icon-btn" onclick="moveEx(${i},1)" ${i===bState.exercises.length-1?'disabled':''}>↓</button><button class="icon-btn danger" onclick="removeEx(${i})">✕</button></div>
  </div>`;}).join('');
  const sets=parseInt(document.getElementById('builderSets').value)||3;
  document.getElementById('sumExercises').textContent=bState.exercises.length;
  document.getElementById('sumSets').textContent=bState.exercises.length*sets;
  document.getElementById('sumTime').textContent=bState.exercises.length?estTime(bState.exercises,sets):'0m';
  document.getElementById('sumMuscles').textContent=getMuscles(bState.exercises)||'—';
}
function updReps(i,v){bState.exercises[i].reps=parseInt(v)||1;renderBuilder();}
function updNotes(i,v){bState.exercises[i].notes=v;}
function moveEx(i,d){const j=i+d;if(j<0||j>=bState.exercises.length)return;[bState.exercises[i],bState.exercises[j]]=[bState.exercises[j],bState.exercises[i]];renderBuilder();}
function removeEx(i){bState.exercises.splice(i,1);renderBuilder();}
function clearBuilder(){bState={exercises:[],editingId:null};['builderName','builderNotes'].forEach(i=>document.getElementById(i).value='');document.getElementById('builderSets').value='3';document.getElementById('builderVest').value='';renderBuilder();}
function saveRoutinePrompt(){
  const name=document.getElementById('builderName').value.trim();
  if(!name){alert('Enter a routine name.');return;}if(!bState.exercises.length){alert('Add at least one exercise.');return;}
  document.getElementById('saveRoutineMsg').textContent=(bState.editingId?'Update':'Save')+` "${name}" with ${bState.exercises.length} exercises?`;
  openModal('modalSaveRoutine');
}
function confirmSaveRoutine(){
  const name=document.getElementById('builderName').value.trim(),sets=parseInt(document.getElementById('builderSets').value)||3,notes=document.getElementById('builderNotes').value.trim(),vest=document.getElementById('builderVest').value;
  if(bState.editingId){const r=db.routines.find(x=>x.id===bState.editingId);if(r){r.name=name;r.sets=sets;r.notes=notes;r.vest=vest;r.exercises=bState.exercises.map(ex=>({...ex}));}}
  else db.routines.push({id:uid(),name,sets,notes,vest,exercises:bState.exercises.map(ex=>({...ex}))});
  saveData();closeModal('modalSaveRoutine');clearBuilder();switchTab('routines');
}

// PICKER
function openExercisePicker(){pickerFilter='All';renderPickerFilters();renderPicker();document.getElementById('pickerSearch').value='';openModal('modalPicker');}
function renderPickerFilters(){
  const cats=['All',...new Set(db.exercises.map(e=>e.category).filter(Boolean).sort())];
  document.getElementById('pickerFilters').innerHTML=cats.map(c=>`<button class="filter-chip ${pickerFilter===c?'active':''}" onclick="setPF('${c}')">${c}</button>`).join('');
}
function setPF(c){pickerFilter=c;renderPickerFilters();renderPicker();}
function renderPicker(){
  const q=document.getElementById('pickerSearch').value.toLowerCase();
  const filt=db.exercises.filter(e=>{const mc=pickerFilter==='All'||e.category===pickerFilter;const mq=!q||e.name.toLowerCase().includes(q)||(e.primary||'').toLowerCase().includes(q);return mc&&mq;});
  const el=document.getElementById('pickerList');
  if(!filt.length){el.innerHTML='<div style="text-align:center;padding:20px;color:var(--text3)">No exercises found.</div>';return;}
  el.innerHTML=filt.map(e=>`<div class="picker-item" onclick="addFromPicker('${e.id}')">${catTag(e.category)}<div><div class="picker-item-name">${e.name}</div><div class="picker-item-sub">${e.primary}${e.secondary?' · '+e.secondary:''} · ${e.weight||'BW'}</div></div></div>`).join('');
}
function addFromPicker(id){bState.exercises.push({exerciseId:id,reps:8,notes:''});renderBuilder();renderPicker();}

// MODALS
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function confirm2(title,msg,cb){document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmMsg').textContent=msg;const btn=document.getElementById('confirmBtn');btn.onclick=()=>{closeModal('modalConfirm');cb();};openModal('modalConfirm');}
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));
document.getElementById('builderSets').addEventListener('input',renderBuilder);

function renderAll(){renderLibrary();renderRoutines();renderBuilder();}
loadData();renderAll();

window.addEventListener('load',()=>{
  const t=localStorage.getItem('ft_token');
  if(t){accessToken=t;document.getElementById('authBtn').textContent='Signed in ✓';setSS('syncing','syncing...');syncDrive();}
  else{document.getElementById('signInBanner').style.display='flex';setSS('','not signed in');}
});
</script>
