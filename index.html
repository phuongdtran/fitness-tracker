<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Tracker</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f8f8; --surface: #ffffff; --surface2: #f0f0f0; --border: #e0e0e0;
    --accent: #0a7a5a; --accent2: #0066cc; --text: #1a1a1a; --text2: #555; --text3: #999;
    --danger: #f04a4a; --warning: #f0a84a;
    --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; font-size: 14px; }

  .header { border-bottom: 1px solid var(--border); padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 100; flex-wrap: wrap; gap: 8px; }
  .header h1 { font-weight: 800; font-size: 18px; letter-spacing: -0.5px; color: var(--accent); }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 24px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 14px 16px; font-weight: 700; font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.2s; background: none; border-top: none; border-left: none; border-right: none; font-family: var(--sans); }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .main { padding: 24px; max-width: 900px; margin: 0 auto; overflow-x: hidden; }
  .section { display: none; }
  .section.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .card-header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
  .card-header:hover { background: var(--surface2); }
  .card-title { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .card-body { padding: 0 16px 16px; display: none; }
  .card-body.open { display: block; }
  .chevron { color: var(--text3); transition: transform 0.2s; font-size: 10px; }
  .chevron.open { transform: rotate(180deg); }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
  .tag-legs { background: #e6f4d7; color: #2d6a0a; }
  .tag-arms { background: #d7eaf4; color: #0a4a6e; }
  .tag-shoulders { background: #f4ead7; color: #7a4a0a; }
  .tag-back { background: #ead7f4; color: #5a0a9a; }
  .tag-chest { background: #f4d7e8; color: #8a0a40; }
  .tag-abs { background: #f4f0d7; color: #6a5a0a; }
  .tag-compound { background: #d7f4f0; color: #0a5a55; }

  /* Table with horizontal scroll on mobile */
  .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .ex-table { width: 100%; border-collapse: collapse; min-width: 520px; }
  .ex-table th { text-align: left; padding: 8px 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text3); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .ex-table td { padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.5; }
  .ex-table tr:last-child td { border-bottom: none; }
  .ex-table tr:hover td { background: var(--surface2); }
  .secondary-muscle { color: var(--text2); font-size: 12px; margin-top: 2px; }

  .btn { padding: 8px 14px; border-radius: 5px; font-family: var(--sans); font-weight: 700; font-size: 12px; letter-spacing: 0.2px; cursor: pointer; border: none; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; }
  .btn-accent { background: var(--accent); color: #ffffff; }
  .btn-accent:hover { background: #0a6a4a; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--text2); color: var(--text); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: var(--danger); color: white; }
  .btn-sm { padding: 5px 10px; font-size: 11px; }

  .actions-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text2); }
  .form-input, .form-select, .form-textarea { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 9px 12px; color: var(--text); font-family: var(--sans); font-size: 14px; width: 100%; transition: border-color 0.15s; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
  .form-select option { background: var(--surface2); }
  .form-textarea { resize: vertical; min-height: 60px; }

  .routine-meta { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0 12px; color: var(--text2); font-size: 13px; }
  .routine-meta span { display: flex; align-items: center; gap: 4px; }

  /* Routine exercise rows — now with inline editing */
  .routine-exercise-row { border-bottom: 1px solid var(--border); }
  .routine-exercise-row:last-child { border-bottom: none; }
  .routine-ex-summary { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; cursor: pointer; }
  .routine-ex-summary:hover { background: var(--surface2); border-radius: 4px; padding-left: 4px; }
  .routine-ex-edit { display: none; background: var(--surface2); border-radius: 6px; padding: 12px; margin: 0 0 10px; }
  .routine-ex-edit.open { display: block; }
  .move-num { font-weight: 800; font-size: 20px; color: var(--accent); min-width: 28px; line-height: 1; margin-top: 2px; }
  .ex-info { flex: 1; }
  .ex-name { font-weight: 700; font-size: 14px; }
  .ex-details { color: var(--text2); font-size: 12px; margin-top: 3px; }
  .edit-hint { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* Inline edit grid inside routine */
  .inline-edit-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  @media (max-width: 500px) { .inline-edit-grid { grid-template-columns: 1fr 1fr; } }

  .builder-exercise { padding: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; }
  .builder-ex-top { display: flex; align-items: center; gap: 8px; }
  .builder-move-num { font-weight: 800; font-size: 18px; color: var(--accent); min-width: 24px; }
  .builder-ex-info { flex: 1; }
  .builder-ex-name { font-weight: 700; font-size: 14px; }
  .builder-ex-sub { color: var(--text2); font-size: 12px; margin-top: 2px; }
  .builder-controls { display: flex; gap: 4px; align-items: center; }
  .icon-btn { width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.15s; }
  .icon-btn:hover { border-color: var(--text2); color: var(--text); }
  .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  /* Builder inline edit fields */
  .builder-ex-fields { display: grid; grid-template-columns: 80px 1fr 1fr; gap: 8px; margin-top: 10px; align-items: end; }
  @media (max-width: 500px) { .builder-ex-fields { grid-template-columns: 1fr 1fr; } }

  .time-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-weight: 700; font-size: 13px; color: var(--accent2); display: inline-flex; align-items: center; gap: 6px; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-chip { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text2); font-family: var(--sans); font-weight: 700; font-size: 11px; cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.3px; }
  .filter-chip:hover { border-color: var(--text2); color: var(--text); }
  .filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(10,122,90,0.08); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h3 { font-weight: 800; font-size: 16px; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  .empty { text-align: center; padding: 40px 20px; color: var(--text3); }
  .empty-icon { font-size: 32px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .section-title { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }

  .builder-summary { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap; }
  .summary-stat { display: flex; flex-direction: column; gap: 3px; }
  .summary-stat-val { font-weight: 800; font-size: 20px; color: var(--accent); }
  .summary-stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }

  .picker-list { max-height: 300px; overflow-y: auto; }
  .picker-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; cursor: pointer; transition: background 0.1s; }
  .picker-item:hover { background: var(--surface2); }
  .picker-item-name { font-weight: 700; font-size: 14px; }
  .picker-item-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

  .search-input-wrap { position: relative; margin-bottom: 12px; }
  .search-input-wrap input { padding-left: 32px; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 14px; }

  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); display: inline-block; transition: background 0.3s; }
  .sync-dot.synced { background: var(--accent); }
  .sync-dot.syncing { background: var(--warning); animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .sync-label { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 5px; }

  .inline-num { width: 64px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; color: var(--text); font-family: var(--sans); font-size: 13px; text-align: center; }

  .signin-banner { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .signin-banner p { color: var(--text2); font-size: 13px; }

  /* New library variant badge */
  .variant-badge { background: #fff8e1; border: 1px solid #ffe082; color: #b36b00; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.3px; }

  @media (max-width: 500px) {
    .main { padding: 12px; overflow-x: hidden; }
    .header { padding: 12px 14px; }
    .tabs { padding: 0 12px; }
    .tab { padding: 12px 10px; font-size: 11px; }
    .section-title { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ FIT TRACKER</h1>
  <div class="header-actions">
    <div class="sync-label">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncLabel">not signed in</span>
    </div>
    <button class="btn btn-ghost btn-sm" id="authBtn" onclick="handleAuthClick()">Sign in</button>
    <button class="btn btn-ghost btn-sm" onclick="exportData()">↓ Export</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()">↑ Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('library')">Exercise Library</button>
  <button class="tab" onclick="switchTab('routines')">Routines</button>
  <button class="tab" onclick="switchTab('builder')">Builder</button>
</div>

<div class="main">
  <div id="signInBanner" class="signin-banner" style="display:none">
    <p>Sign in with Google to sync your data across all devices automatically.</p>
    <button class="btn btn-accent btn-sm" onclick="handleAuthClick()">Sign in with Google</button>
  </div>

  <!-- LIBRARY -->
  <div id="tab-library" class="section active">
    <div class="section-header">
      <span class="section-title">Exercise Library</span>
      <button class="btn btn-accent" onclick="openAddExercise()">+ Add Exercise</button>
    </div>
    <div class="filter-row" id="libraryFilters"></div>
    <div id="libraryList"></div>
  </div>

  <!-- ROUTINES -->
  <div id="tab-routines" class="section">
    <div class="section-header">
      <span class="section-title">Routines</span>
      <button class="btn btn-accent" onclick="switchTab('builder')">+ New Routine</button>
    </div>
    <div id="routinesList"></div>
  </div>

  <!-- BUILDER -->
  <div id="tab-builder" class="section">
    <div class="section-header"><span class="section-title">Routine Builder</span></div>
    <div class="card" style="margin-bottom:20px">
      <div style="padding:16px">
        <div class="form-grid" style="margin-top:0">
          <div class="form-group"><label class="form-label">Routine Name</label><input class="form-input" id="builderName" placeholder="e.g. Leg Complex"></div>
          <div class="form-group"><label class="form-label">Sets (global default)</label><input class="form-input" type="number" id="builderSets" value="3" min="1" max="10"></div>
          <div class="form-group"><label class="form-label">Notes</label><input class="form-input" id="builderNotes" placeholder="Optional routine notes"></div>
          <div class="form-group"><label class="form-label">Vest</label>
            <select class="form-select" id="builderVest">
              <option value="">No vest</option>
              <option value="20 lb vest">20 lb vest</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="builder-summary">
      <div class="summary-stat"><span class="summary-stat-val" id="sumExercises">0</span><span class="summary-stat-label">Exercises</span></div>
      <div class="summary-stat"><span class="summary-stat-val" id="sumSets">0</span><span class="summary-stat-label">Total Sets</span></div>
      <div class="summary-stat"><span class="summary-stat-val" id="sumTime">0m</span><span class="summary-stat-label">Est. Time</span></div>
      <div class="summary-stat"><span class="summary-stat-val" id="sumMuscles" style="font-size:12px;line-height:1.4">—</span><span class="summary-stat-label">Muscles</span></div>
    </div>
    <div id="builderExercises"></div>
    <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="openExercisePicker()">+ Add Exercise</button>
      <button class="btn btn-accent" onclick="saveRoutinePrompt()">Save Routine</button>
      <button class="btn btn-ghost" onclick="clearBuilder()">Clear</button>
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="modalAddEx">
  <div class="modal">
    <h3>Add Exercise</h3>
    <div class="form-grid" style="margin-top:0">
      <div class="form-group full"><label class="form-label">Exercise Name</label><input class="form-input" id="exName" placeholder="e.g. Single leg RDL"></div>
      <div class="form-group"><label class="form-label">Primary Muscle</label>
        <select class="form-select" id="exPrimary"><option value="">Select...</option><option>Hamstrings</option><option>Glutes</option><option>Quads</option><option>Inner thigh</option><option>Calves</option><option>Biceps</option><option>Triceps</option><option>Shoulders</option><option>Chest</option><option>Back</option><option>Core</option><option>Abs</option><option>Compound</option></select>
      </div>
      <div class="form-group"><label class="form-label">Secondary Muscle</label><input class="form-input" id="exSecondary" placeholder="e.g. Core, Balance"></div>
      <div class="form-group"><label class="form-label">Weight</label><input class="form-input" id="exWeight" placeholder="e.g. 2x20 lbs"></div>
      <div class="form-group"><label class="form-label">Category</label>
        <select class="form-select" id="exCategory"><option value="">Auto</option><option>Legs</option><option>Arms</option><option>Shoulders</option><option>Back</option><option>Chest</option><option>Abs</option><option>Compound</option></select>
      </div>
      <div class="form-group full"><label class="form-label">Notes / Cues</label><textarea class="form-textarea" id="exNotes" placeholder="e.g. Pulsing, single leg"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalAddEx')">Cancel</button>
      <button class="btn btn-accent" onclick="saveExercise()">Save Exercise</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalEditEx">
  <div class="modal">
    <h3>Edit Exercise</h3>
    <input type="hidden" id="editExId">
    <div class="form-grid" style="margin-top:0">
      <div class="form-group full"><label class="form-label">Exercise Name</label><input class="form-input" id="editExName"></div>
      <div class="form-group"><label class="form-label">Primary Muscle</label>
        <select class="form-select" id="editExPrimary"><option value="">Select...</option><option>Hamstrings</option><option>Glutes</option><option>Quads</option><option>Inner thigh</option><option>Calves</option><option>Biceps</option><option>Triceps</option><option>Shoulders</option><option>Chest</option><option>Back</option><option>Core</option><option>Abs</option><option>Compound</option></select>
      </div>
      <div class="form-group"><label class="form-label">Secondary Muscle</label><input class="form-input" id="editExSecondary"></div>
      <div class="form-group"><label class="form-label">Weight</label><input class="form-input" id="editExWeight"></div>
      <div class="form-group"><label class="form-label">Category</label>
        <select class="form-select" id="editExCategory"><option value="">Auto</option><option>Legs</option><option>Arms</option><option>Shoulders</option><option>Back</option><option>Chest</option><option>Abs</option><option>Compound</option></select>
      </div>
      <div class="form-group full"><label class="form-label">Notes / Cues</label><textarea class="form-textarea" id="editExNotes"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalEditEx')">Cancel</button>
      <button class="btn btn-accent" onclick="updateExercise()">Save Changes</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalPicker">
  <div class="modal">
    <h3>Add Exercise to Routine</h3>
    <div class="filter-row" id="pickerFilters" style="margin-bottom:10px"></div>
    <div class="search-input-wrap">
      <span class="search-icon">⌕</span>
      <input class="form-input" id="pickerSearch" placeholder="Search exercises..." oninput="renderPicker()">
    </div>
    <div class="picker-list" id="pickerList"></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal('modalPicker')">Done</button></div>
  </div>
</div>

<div class="modal-overlay" id="modalConfirm">
  <div class="modal">
    <h3 id="confirmTitle">Are you sure?</h3>
    <p id="confirmMsg" style="color:var(--text2);font-size:13px;margin-bottom:4px"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalConfirm')">Cancel</button>
      <button class="btn btn-danger" id="confirmBtn">Confirm</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalSaveRoutine">
  <div class="modal">
    <h3>Save Routine?</h3>
    <p style="color:var(--text2);font-size:13px;margin-bottom:4px" id="saveRoutineMsg"></p>
    <div id="saveRoutineVariants" style="margin-top:12px"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalSaveRoutine')">Cancel</button>
      <button class="btn btn-accent" onclick="confirmSaveRoutine()">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalEditRoutine">
  <div class="modal">
    <h3>Edit Routine</h3>
    <input type="hidden" id="editRoutineId">
    <div class="form-grid" style="margin-top:0">
      <div class="form-group full"><label class="form-label">Routine Name</label><input class="form-input" id="editRoutineName"></div>
      <div class="form-group"><label class="form-label">Sets</label><input class="form-input" type="number" id="editRoutineSets" min="1" max="10"></div>
      <div class="form-group"><label class="form-label">Vest</label>
        <select class="form-select" id="editRoutineVest"><option value="">No vest</option><option value="20 lb vest">20 lb vest</option></select>
      </div>
      <div class="form-group full"><label class="form-label">Notes</label><input class="form-input" id="editRoutineNotes"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modalEditRoutine')">Cancel</button>
      <button class="btn btn-accent" onclick="updateRoutine()">Save Changes</button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const CLIENT_ID = '46096792648-uep414vh6ttj77cfndi17pmo9ia2s45c.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME = 'fittracker_data.json';
const LOCAL_KEY = 'fittracker_v1';

// ── STATE ────────────────────────────────────────────────────
let db = { exercises: [], routines: [] };

// ── AUTH ─────────────────────────────────────────────────────
function handleAuthClick() {
  const client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { setSyncStatus('error', 'auth error'); return; }
      accessToken = resp.access_token;
      localStorage.setItem('ft_token', accessToken);
      document.getElementById('authBtn').textContent = 'Signed in ✓';
      document.getElementById('signInBanner').style.display = 'none';
      setSyncStatus('syncing', 'syncing...');
      await syncWithDrive();
    }
  });
  client.requestAccessToken();
}

function setSyncStatus(state, label) {
  document.getElementById('syncDot').className = 'sync-dot ' + state;
  document.getElementById('syncLabel').textContent = label;
}

// ── DRIVE SYNC ───────────────────────────────────────────────
async function driveRequest(method, url, body) {
  const opts = { method, headers: { Authorization: 'Bearer ' + accessToken } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  if (r.status === 401) { accessToken = null; setSyncStatus('error', 'token expired'); return null; }
  if (!r.ok) return null;
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

async function findOrCreateFile() {
  const list = await driveRequest('GET',
    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${DRIVE_FILE_NAME}'&fields=files(id,name)`);
  if (!list) return null;
  if (list.files && list.files.length > 0) { driveFileId = list.files[0].id; return driveFileId; }
  const meta = await driveRequest('POST', 'https://www.googleapis.com/drive/v3/files?fields=id',
    { name: DRIVE_FILE_NAME, parents: ['appDataFolder'] });
  if (!meta) return null;
  driveFileId = meta.id; return driveFileId;
}

async function readFromDrive() {
  if (!driveFileId) return null;
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,
    { headers: { Authorization: 'Bearer ' + accessToken } });
  if (!r.ok) return null;
  try { return await r.json(); } catch { return null; }
}

async function writeToDrive() {
  if (!driveFileId) return;
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
    method: 'PATCH',
    headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
    body: JSON.stringify(db)
  });
}

async function syncWithDrive() {
  if (!accessToken) return;
  setSyncStatus('syncing', 'syncing...');
  try {
    await findOrCreateFile();
    if (!driveFileId) { setSyncStatus('error', 'drive error'); return; }
    const remote = await readFromDrive();
    if (remote && remote.exercises && remote.routines) {
      const localTs = parseInt(localStorage.getItem('ft_ts') || '0');
      const remoteTs = remote._ts || 0;
      if (remoteTs > localTs) { db = remote; saveLocal(); renderAll(); }
      else { await writeToDrive(); }
    } else { await writeToDrive(); }
    setSyncStatus('synced', 'synced ✓');
  } catch(e) { setSyncStatus('error', 'sync error'); }
}

function scheduleDriveSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { if (accessToken) syncWithDrive(); }, 2000);
}

// ── LOCAL STORAGE ────────────────────────────────────────────
function saveLocal() {
  localStorage.setItem('ft_ts', Date.now());
  localStorage.setItem(LOCAL_KEY, JSON.stringify(db));
}

function saveData() {
  saveLocal();
  if (accessToken) { setSyncStatus('syncing', 'saving...'); scheduleDriveSync(); }
  else { setSyncStatus('', 'saved locally'); }
}

function loadData() {
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    if (raw) { db = JSON.parse(raw); }
    else { db = { exercises: JSON.parse(JSON.stringify(seedExercises)), routines: JSON.parse(JSON.stringify(seedRoutines)) }; saveLocal(); }
  } catch { db = { exercises: JSON.parse(JSON.stringify(seedExercises)), routines: JSON.parse(JSON.stringify(seedRoutines)) }; }
}

// ── EXPORT / IMPORT ──────────────────────────────────────────
function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'fittracker_backup.json'; a.click();
}

function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.exercises && data.routines) { db = data; saveData(); renderAll(); alert('Import successful.'); }
      else alert('Invalid backup file.');
    } catch { alert('Could not parse file.'); }
  };
  reader.readAsText(file); e.target.value = '';
}

// ── UTILS ────────────────────────────────────────────────────
function uid() { return 'id_' + Math.random().toString(36).substr(2,9); }
function getExercise(id) { return db.exercises.find(e => e.id === id); }

function categoryTag(cat) {
  const m = { Legs:'tag-legs',Arms:'tag-arms',Shoulders:'tag-shoulders',Back:'tag-back',Chest:'tag-chest',Abs:'tag-abs',Compound:'tag-compound' };
  return `<span class="tag ${m[cat]||'tag-compound'}">${cat}</span>`;
}

function estimateTime(exercises, sets) {
  let s = 0; exercises.forEach(ex => { s += ex.reps*3+20; }); s *= sets; s += (sets-1)*60;
  return Math.round(s/60)+'m';
}

function getMuscles(exercises) {
  const m = new Set(); exercises.forEach(ex => { const e=getExercise(ex.exerciseId); if(e) m.add(e.primary); }); return [...m].join(', ');
}

function autoCategory(p) {
  if(['Hamstrings','Glutes','Quads','Inner thigh','Calves'].includes(p)) return 'Legs';
  if(['Biceps','Triceps'].includes(p)) return 'Arms';
  if(p==='Shoulders') return 'Shoulders';
  if(['Core','Abs'].includes(p)) return 'Abs';
  if(p==='Back') return 'Back'; if(p==='Chest') return 'Chest';
  return 'Compound';
}

// ── AUTO-ADD VARIANTS TO LIBRARY ─────────────────────────────
// Called on routine save. If an exercise in the routine has a customName
// that differs from the library name, add it as a new library entry (if no dupe).
function autoAddVariantsToLibrary(routineExercises, routineName) {
  let added = 0;
  routineExercises.forEach(rex => {
    if (!rex.customName) return; // no name override, skip
    const original = getExercise(rex.exerciseId);
    if (!original) return;
    if (rex.customName.trim() === original.name.trim()) return; // same name, skip
    const variantName = `${rex.customName.trim()} (${routineName})`;
    // Check for dupe
    const exists = db.exercises.some(e => e.name.toLowerCase() === variantName.toLowerCase());
    if (exists) return;
    // Add to library, inheriting original's properties
    db.exercises.push({
      id: uid(),
      name: variantName,
      primary: original.primary,
      secondary: original.secondary,
      category: original.category,
      weight: original.weight,
      notes: original.notes,
      _variant: true,
      _sourceId: rex.exerciseId
    });
    added++;
  });
  return added;
}

function updateRoutineExField(routineId, exIndex, field, value) {
  const r = db.routines.find(x => x.id === routineId);
  if (!r || !r.exercises[exIndex]) return;
  r.exercises[exIndex][field] = value;
  saveData();
  // Re-render just the exercise list portion without collapsing the card
  const listEl = document.getElementById(`routine-exlist-${routineId}`);
  if (listEl) listEl.innerHTML = renderRoutineExercises(r);
  // Re-open the edit panel that was just interacted with
  const editId = `redit-${routineId}-${exIndex}`;
  const editEl = document.getElementById(editId);
  if (editEl) editEl.classList.add('open');
}

function openEditRoutineMeta(id) {
  const r=db.routines.find(x=>x.id===id); if(!r) return;
  document.getElementById('editRoutineId').value=id; document.getElementById('editRoutineName').value=r.name;
  document.getElementById('editRoutineSets').value=r.sets; document.getElementById('editRoutineVest').value=r.vest||'';
  document.getElementById('editRoutineNotes').value=r.notes||''; openModal('modalEditRoutine');
}

function updateRoutine() {
  const id=document.getElementById('editRoutineId').value; const r=db.routines.find(x=>x.id===id); if(!r) return;
  r.name=document.getElementById('editRoutineName').value.trim();
  r.sets=parseInt(document.getElementById('editRoutineSets').value)||3;
  r.vest=document.getElementById('editRoutineVest').value;
  r.notes=document.getElementById('editRoutineNotes').value.trim();
  saveData(); closeModal('modalEditRoutine'); renderRoutines();
}

function deleteRoutinePrompt(id) {
  const r=db.routines.find(x=>x.id===id); if(!r) return;
  confirm2(`Delete routine "${r.name}"?`,'Library exercises will not be affected.',()=>{
    db.routines=db.routines.filter(x=>x.id!==id); saveData(); renderRoutines();
  });
}

function loadRoutineIntoBuilder(id) {
  const r=db.routines.find(x=>x.id===id); if(!r) return;
  builderState.editingId=id; builderState.exercises=r.exercises.map(ex=>({...ex}));
  document.getElementById('builderName').value=r.name; document.getElementById('builderSets').value=r.sets;
  document.getElementById('builderNotes').value=r.notes||''; document.getElementById('builderVest').value=r.vest||'';
  switchTab('builder');
}

// ── BUILDER ──────────────────────────────────────────────────
let builderState={exercises:[],editingId:null};
let pickerFilter='All';

function renderBuilder() {
  const exEl=document.getElementById('builderExercises');
  if(!builderState.exercises.length){
    exEl.innerHTML=`<div class="empty" style="padding:24px 0"><div class="empty-icon">🏗</div><p>Click "+ Add Exercise" to start.</p></div>`;
  } else {
    exEl.innerHTML=builderState.exercises.map((ex,i)=>{
      const e=getExercise(ex.exerciseId);
      const displayName = ex.customName || (e ? e.name : 'Missing');
      return `<div class="builder-exercise">
        <div class="builder-ex-top">
          <div class="builder-move-num">${i+1}</div>
          <div class="builder-ex-info">
            <div class="builder-ex-name">${e ? displayName : '<em style="color:var(--danger)">Missing</em>'}
              ${ex.customName && e && ex.customName !== e.name ? `<span class="variant-badge" style="margin-left:6px">renamed</span>` : ''}
            </div>
            <div class="builder-ex-sub">${e?(e.category||'')+(e.primary?' · '+e.primary:''):''}</div>
          </div>
          <div class="builder-controls">
            <button class="icon-btn" onclick="moveBuilderEx(${i},-1)" ${i===0?'disabled':''}>↑</button>
            <button class="icon-btn" onclick="moveBuilderEx(${i},1)" ${i===builderState.exercises.length-1?'disabled':''}>↓</button>
            <button class="icon-btn danger" onclick="removeBuilderEx(${i})">✕</button>
          </div>
        </div>
        <div class="builder-ex-fields">
          <div class="form-group">
            <label class="form-label">Reps</label>
            <input class="form-input" type="number" style="font-size:13px;padding:6px 8px;text-align:center" 
              value="${ex.reps}" min="1" max="99" 
              onchange="updateBuilderExField(${i},'reps',parseInt(this.value)||1)">
          </div>
          <div class="form-group">
            <label class="form-label">Name override</label>
            <input class="form-input" style="font-size:13px;padding:6px 8px" 
              value="${ex.customName||''}" 
              placeholder="${e?e.name:'name'}"
              onchange="updateBuilderExField(${i},'customName',this.value)">
          </div>
          <div class="form-group">
            <label class="form-label">Notes</label>
            <input class="form-input" style="font-size:13px;padding:6px 8px" 
              value="${ex.notes||''}" placeholder="e.g. each side"
              onchange="updateBuilderExField(${i},'notes',this.value)">
          </div>
        </div>
      </div>`;
    }).join('');
  }
  const sets=parseInt(document.getElementById('builderSets').value)||3;
  document.getElementById('sumExercises').textContent=builderState.exercises.length;
  document.getElementById('sumSets').textContent=builderState.exercises.length*sets;
  document.getElementById('sumTime').textContent=builderState.exercises.length?estimateTime(builderState.exercises,sets):'0m';
  document.getElementById('sumMuscles').textContent=getMuscles(builderState.exercises)||'—';
}

function updateBuilderExField(i, field, value) {
  builderState.exercises[i][field] = value;
  // Don't full re-render (would lose focus) — just update summary stats
  const sets=parseInt(document.getElementById('builderSets').value)||3;
  document.getElementById('sumExercises').textContent=builderState.exercises.length;
  document.getElementById('sumSets').textContent=builderState.exercises.length*sets;
}

function moveBuilderEx(i,dir){const j=i+dir;if(j<0||j>=builderState.exercises.length)return;[builderState.exercises[i],builderState.exercises[j]]=[builderState.exercises[j],builderState.exercises[i]];renderBuilder();}
function removeBuilderEx(i){builderState.exercises.splice(i,1);renderBuilder();}

function clearBuilder(){
  builderState={exercises:[],editingId:null};
  document.getElementById('builderName').value=''; document.getElementById('builderSets').value='3';
  document.getElementById('builderNotes').value=''; document.getElementById('builderVest').value='';
  renderBuilder();
}

function saveRoutinePrompt(){
  const name=document.getElementById('builderName').value.trim();
  if(!name){alert('Please enter a routine name.');return;}
  if(!builderState.exercises.length){alert('Add at least one exercise.');return;}

  // Detect any name overrides that will become new library entries
  const newVariants = builderState.exercises.filter(rex => {
    if (!rex.customName) return false;
    const orig = getExercise(rex.exerciseId);
    if (!orig) return false;
    if (rex.customName.trim() === orig.name.trim()) return false;
    const variantName = `${rex.customName.trim()} (${name})`;
    return !db.exercises.some(e => e.name.toLowerCase() === variantName.toLowerCase());
  });

  let msg = `${builderState.editingId?'Update':'Save'} "${name}" with ${builderState.exercises.length} exercises?`;
  let variantHtml = '';
  if (newVariants.length) {
    variantHtml = `<div style="background:var(--surface2);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--text2)">
      <strong style="color:var(--text)">New library entries will be added:</strong><br>
      ${newVariants.map(rex => {
        const orig = getExercise(rex.exerciseId);
        return `· ${rex.customName.trim()} (${name})`;
      }).join('<br>')}
    </div>`;
  }

  document.getElementById('saveRoutineMsg').textContent = msg;
  document.getElementById('saveRoutineVariants').innerHTML = variantHtml;
  openModal('modalSaveRoutine');
}

function confirmSaveRoutine(){
  const name=document.getElementById('builderName').value.trim();
  const sets=parseInt(document.getElementById('builderSets').value)||3;
  const notes=document.getElementById('builderNotes').value.trim();
  const vest=document.getElementById('builderVest').value;
  const exercises = builderState.exercises.map(ex=>({...ex}));

  // Auto-add name variants to library
  autoAddVariantsToLibrary(exercises, name);

  if(builderState.editingId){
    const r=db.routines.find(x=>x.id===builderState.editingId);
    if(r){r.name=name;r.sets=sets;r.notes=notes;r.vest=vest;r.exercises=exercises;}
  } else {
    db.routines.push({id:uid(),name,sets,notes,vest,exercises});
  }
  saveData(); closeModal('modalSaveRoutine'); clearBuilder(); switchTab('routines');
}

// ── PICKER ───────────────────────────────────────────────────
function openExercisePicker(){
  pickerFilter='All'; renderPickerFilters(); renderPicker();
  document.getElementById('pickerSearch').value=''; openModal('modalPicker');
}

function renderPickerFilters(){
  const cats=['All',...new Set(db.exercises.map(e=>e.category).filter(Boolean).sort())];
  document.getElementById('pickerFilters').innerHTML=cats.map(c=>
    `<button class="filter-chip ${pickerFilter===c?'active':''}" onclick="setPickerFilter('${c}')">${c}</button>`
  ).join('');
}

function setPickerFilter(cat){pickerFilter=cat;renderPickerFilters();renderPicker();}

function renderPicker(){
  const q=document.getElementById('pickerSearch').value.toLowerCase();
  const filtered=db.exercises.filter(e=>{
    const mc=pickerFilter==='All'||e.category===pickerFilter;
    const mq=!q||e.name.toLowerCase().includes(q)||(e.primary||'').toLowerCase().includes(q);
    return mc&&mq;
  });
  const el=document.getElementById('pickerList');
  if(!filtered.length){el.innerHTML=`<div style="text-align:center;padding:20px;color:var(--text3)">No exercises found.</div>`;return;}
  el.innerHTML=filtered.map(e=>`
    <div class="picker-item" onclick="addExerciseFromPicker('${e.id}')">
      ${categoryTag(e.category)}
      <div><div class="picker-item-name">${e.name}</div>
      <div class="picker-item-sub">${e.primary}${e.secondary?' · '+e.secondary:''} · ${e.weight||'BW'}</div></div>
    </div>`).join('');
}

function addExerciseFromPicker(id){builderState.exercises.push({exerciseId:id,reps:8,notes:'',customName:''});renderBuilder();renderPicker();}

// ── MODALS ───────────────────────────────────────────────────
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function confirm2(title,msg,cb){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmMsg').textContent=msg;
  const btn=document.getElementById('confirmBtn');
  btn.onclick=()=>{closeModal('modalConfirm');cb();};
  openModal('modalConfirm');
}
document.querySelectorAll('.modal-overlay').forEach(o=>{o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});});
document.getElementById('builderSets').addEventListener('input',renderBuilder);

// ── RENDER ALL ───────────────────────────────────────────────
function renderAll(){renderLibrary();renderRoutines();renderBuilder();}

// ── INIT ─────────────────────────────────────────────────────
loadData();
renderAll();
window.addEventListener('load', () => {
  const storedToken = localStorage.getItem('ft_token');
  if (storedToken) {
    accessToken = storedToken;
    document.getElementById('authBtn').textContent = 'Signed in ✓';
    setSyncStatus('syncing', 'syncing...');
    syncWithDrive();
  } else {
    document.getElementById('signInBanner').style.display = 'flex';
    setSyncStatus('', 'not signed in');
  }
});
</script>
</body>
</html>
